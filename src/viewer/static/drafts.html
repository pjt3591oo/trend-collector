<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시 초안 · Trend Atlas</title><link rel="stylesheet" href="/style.css"><script src="/drafts.js" defer></script></head>
<body class="draft-workspace"><main><header><a href="/">← Trend Atlas</a><strong>게시 초안</strong></header>
<section class="workspace"><div class="page-heading"><div><div class="eyebrow">DRAFT STUDIO</div><h1>소식을 게시글로</h1><p>원문 기반 초안을 생성하고, 저장된 본문을 검토한 뒤 Threads에 발행하세요.</p></div></div>
<div id="draft-status" role="status" aria-live="polite"></div>
<section><h2>1. 분석과 항목 선택</h2><div class="filters"><select id="draft-analysis" aria-label="분석 선택"></select><select id="draft-category" aria-label="카테고리 필터"><option value="">모든 카테고리</option></select><select id="draft-source" aria-label="소스 필터"><option value="">모든 소스</option></select></div>
<p id="draft-selection"></p><div id="draft-items" class="draft-items"></div><div class="draft-generate-actions"><button class="button" id="generate-draft" disabled><span class="draft-spinner" id="draft-button-spinner" aria-hidden="true" hidden></span><span id="generate-draft-label">선택 항목으로 초안 생성</span></button><div id="draft-loading" class="draft-loading" role="status" hidden><span class="draft-spinner" aria-hidden="true"></span><div><strong>초안을 생성하고 있습니다</strong><small>원문 읽기 · 게시글 작성 · 저장이 끝날 때까지 기다려 주세요.</small></div></div></div><p>LLM API 사용량이 발생할 수 있습니다. 생성만 수행하며 SNS에 게시하지 않습니다.</p></section>
<section><div class="collection-bar"><h2>저장된 초안</h2><button id="reload-drafts" class="button">새로고침</button></div>
<div class="filters"><input id="saved-search" type="search" placeholder="제목·본문 검색" aria-label="저장된 초안 검색"><select id="saved-status" aria-label="초안 발행 상태"><option value="">모든 발행 상태</option><option value="draft">미발행</option><option value="published">발행 완료</option><option value="partial">일부 발행</option><option value="failed">발행 실패</option><option value="pending">결과 미확인</option></select><select id="saved-category" aria-label="초안 카테고리"><option value="">모든 카테고리</option></select><select id="saved-source" aria-label="초안 소스"><option value="">모든 소스</option></select><button id="reset-saved-filters" class="button">초기화</button></div><p id="saved-count" role="status"></p>
<div id="saved-drafts"></div><button id="more-drafts" class="button" hidden>더 보기</button></section>
</section></main></body></html>
